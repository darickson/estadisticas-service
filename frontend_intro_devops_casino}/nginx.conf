server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Backends internos por DNS del clúster (Service ClusterIP) ---
    # Nginx hace match por el prefijo MAS especifico primero, por eso
    # /api/bonos, /api/apuestas y /api/estadisticas van antes de /api/.

    location /api/bonos/ {
        proxy_pass http://bonos-service:8004/api/bonos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/apuestas/ {
        proxy_pass http://apuestas-service:8005/api/apuestas/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/estadisticas/ {
        proxy_pass http://estadisticas-service:8006/api/estadisticas/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Resto de /api/* (auth, usuarios, juegos, transacciones) -> casino-backend
    location /api/ {
        proxy_pass http://casino-backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA Angular: cualquier ruta que no sea /api/* cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
